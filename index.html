<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0a19" />
  <meta name="description" content="Bitbound: an original pixel RPG where quantization is the magic. Explore the Static Isle, snap values onto grids, and befriend seven spirits." />
  <title>Bitbound — The Static Isle</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="wordmark" href="./">Bitbound <small>The Static Isle</small></a>
      <div class="actions">
        <button id="music-toggle" type="button" aria-pressed="true"><span data-label>Music on</span> <kbd>M</kbd></button>
        <button id="fullscreen-toggle" type="button">Full screen <kbd>F</kbd></button>
      </div>
    </header>
    <main id="stage" class="stage">
      <canvas id="game" width="384" height="216" tabindex="0" role="application" aria-label="Bitbound. Press Enter to begin with music."></canvas>
    </main>
    <nav id="touch" class="touch" aria-label="Touch controls">
      <div class="dpad">
        <button type="button" data-action="up" aria-label="Up">▲</button>
        <button type="button" data-action="left" aria-label="Left">◀</button>
        <button type="button" data-action="right" aria-label="Right">▶</button>
        <button type="button" data-action="down" aria-label="Down">▼</button>
      </div>
      <div class="face">
        <button type="button" data-action="pause" aria-label="Pause">START</button>
        <button type="button" data-action="cancel" aria-label="Back">B</button>
        <button type="button" data-action="confirm" aria-label="Confirm">A</button>
      </div>
    </nav>
    <footer class="footer">
      <span>WASD move · Shift run · Enter/Space act · Esc pause · N notes · M music</span>
      <a href="https://github.com/mottopanikeiku/bitbound-quantization-quest" target="_blank" rel="noopener noreferrer">Research &amp; source ↗</a>
    </footer>
    <p id="readout" class="sr-only" role="status" aria-live="polite"></p>
  </div>
  <noscript>Bitbound runs entirely in your browser. Enable JavaScript to play.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
